apiVersion: apps/v1
kind: Deployment
metadata:
  name: giftcard-api
  namespace: giftcard-sentiment
  labels:
    app.kubernetes.io/name: giftcard-sentiment
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: giftcard-sentiment
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: giftcard-sentiment
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api
          image: ghcr.io/ixxet/giftcard-sentiment-api:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: giftcard-config
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
