apiVersion: v1
kind: Service
metadata:
  name: giftcard-api
  namespace: giftcard-sentiment
  labels:
    app.kubernetes.io/name: giftcard-sentiment
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: giftcard-sentiment
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: giftcard-ui
  namespace: giftcard-sentiment
  labels:
    app.kubernetes.io/name: giftcard-sentiment
    app.kubernetes.io/component: ui
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: giftcard-sentiment
    app.kubernetes.io/component: ui
  ports:
    - name: http
      port: 80
      targetPort: http
