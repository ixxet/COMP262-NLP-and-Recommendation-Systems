apiVersion: apps/v1
kind: Deployment
metadata:
  name: giftcard-ui
  namespace: giftcard-sentiment
  labels:
    app.kubernetes.io/name: giftcard-sentiment
    app.kubernetes.io/component: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: giftcard-sentiment
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: giftcard-sentiment
        app.kubernetes.io/component: ui
    spec:
      containers:
        - name: ui
          image: ghcr.io/ixxet/giftcard-sentiment-ui:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: giftcard-config
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
